<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Système B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Système B</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Message si config.js n'est pas rempli -->
  <section id="setup" class="center-card" hidden>
    <h1>Système B</h1>
    <p>Il manque la configuration Supabase.</p>
    <p class="muted">Ouvre <code>config.js</code> et renseigne l'URL du projet et la clé publique (voir le README).</p>
  </section>

  <!-- Connexion -->
  <section id="auth" class="center-card" hidden>
    <h1>Système B</h1>
    <form id="auth-form" autocomplete="on">
      <label>E-mail
        <input type="email" id="auth-email" autocomplete="username" required>
      </label>
      <label>Mot de passe
        <input type="password" id="auth-password" autocomplete="current-password" required>
      </label>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">Se connecter</button>
    </form>
  </section>

  <!-- Application -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <h1>Système B</h1>
        <button id="btn-logout" class="ghost" type="button">Déconnexion</button>
      </div>
      <input type="search" id="q" placeholder="Rechercher un titre, un mot, une étiquette…" enterkeyhint="search" autocomplete="off">
      <nav id="types" class="chips" aria-label="Filtrer par type"></nav>
      <nav id="tags" class="chips small" aria-label="Filtrer par étiquette"></nav>
    </header>

    <main id="list" class="list"></main>

    <div class="fab-group">
      <button id="fab-capture" type="button" class="fab-pill">Capturer</button>
      <button id="fab" type="button" aria-label="Ajouter un élément">+</button>
    </div>
    <input type="file" id="capture-input" accept="image/*" hidden>
  </div>

  <!-- Fiche : ajout / modification -->
  <div id="sheet-backdrop" hidden>
    <form id="sheet" class="sheet" autocomplete="off">
      <div class="sheet-head">
        <h2 id="sheet-title">Nouvel élément</h2>
        <button type="button" id="sheet-close" class="ghost" aria-label="Fermer">Fermer</button>
      </div>

      <button type="button" id="f-ai" class="ai-btn">
        <span id="f-ai-label">Remplir avec l'IA</span>
        <span class="muted">image, texte ou lien</span>
      </button>

      <div class="row">
        <label class="grow">Type
          <select id="f-type"></select>
        </label>
        <label id="f-status-wrap" class="grow">Statut
          <select id="f-status"></select>
        </label>
      </div>

      <label>Titre
        <input type="text" id="f-title" required maxlength="200">
      </label>

      <div id="f-rating-wrap">
        <span class="label-text">Note</span>
        <div id="f-rating" class="stars" role="group" aria-label="Note sur 5"></div>
      </div>

      <label>Étiquettes <span class="muted">(séparées par des virgules)</span>
        <input type="text" id="f-tags" list="tag-suggestions" autocapitalize="none" autocorrect="off">
        <datalist id="tag-suggestions"></datalist>
      </label>

      <label>Notes
        <textarea id="f-content" rows="5"></textarea>
      </label>

      <div class="row">
        <label class="grow">Date
          <input type="date" id="f-date">
        </label>
        <label class="grow">Lien
          <input type="url" id="f-url" inputmode="url" autocapitalize="none" placeholder="https://">
        </label>
      </div>

      <div>
        <span class="label-text">Image</span>
        <div id="f-image-preview" class="image-preview" hidden>
          <img id="f-image-img" alt="">
          <button type="button" id="f-image-remove" class="ghost danger-text">Retirer</button>
        </div>
        <input type="file" id="f-image" accept="image/*">
      </div>

      <div class="sheet-actions">
        <button type="button" id="f-delete" class="ghost danger-text" hidden>Supprimer</button>
        <span class="spacer"></span>
        <button type="submit" id="f-save" class="primary">Enregistrer</button>
      </div>
    </form>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
